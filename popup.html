<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon Product Filter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      width: 280px;
      background: #fff;
      color: #111;
    }

    /* Header */
    .header {
      background: #232f3e;
      color: #fff;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-title {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-title .logo {
      font-size: 18px;
    }

    /* Toggle switch */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toggle-label {
      font-size: 11px;
      opacity: 0.85;
    }
    .switch {
      position: relative;
      width: 36px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      background: #666;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      left: 3px;
      top: 3px;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider {
      background: #ff9900;
    }
    input:checked + .slider::before {
      transform: translateX(16px);
    }

    /* Stats bar */
    .stats-bar {
      background: #f0f2f2;
      padding: 7px 14px;
      font-size: 12px;
      color: #555;
      border-bottom: 1px solid #ddd;
      min-height: 30px;
      display: flex;
      align-items: center;
    }
    .stats-bar span {
      color: #c7511f;
      font-weight: 600;
    }

    /* Body */
    .body {
      padding: 10px 14px;
    }

    /* Section */
    .section {
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 8px;
    }

    /* Field row */
    .field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
    }
    .field label {
      color: #333;
      flex: 1;
      cursor: default;
    }
    .field input[type="number"] {
      width: 72px;
      padding: 4px 7px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      text-align: right;
      color: #111;
      background: #fafafa;
      transition: border-color 0.15s;
    }
    .field input[type="number"]:focus {
      outline: none;
      border-color: #ff9900;
      background: #fff;
    }

    /* Toggle field */
    .field .mini-switch {
      flex: none;
      width: 32px;
      height: 18px;
    }

    /* Radio group */
    .radio-group {
      display: flex;
      gap: 10px;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      font-size: 13px;
      color: #333;
    }
    .radio-group input[type="radio"] {
      accent-color: #ff9900;
    }

    /* Mini toggle */
    .mini-toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mini-switch {
      position: relative;
      width: 32px;
      height: 18px;
    }
    .mini-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .mini-slider {
      position: absolute;
      inset: 0;
      background: #ccc;
      border-radius: 18px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .mini-slider::before {
      content: '';
      position: absolute;
      left: 3px;
      top: 3px;
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .mini-slider {
      background: #ff9900;
    }
    input:checked + .mini-slider::before {
      transform: translateX(14px);
    }

    /* Divider */
    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 10px 0;
    }

    /* Disabled state */
    body.disabled .body {
      opacity: 0.45;
      pointer-events: none;
    }

    /* Note text */
    .note {
      font-size: 11px;
      color: #999;
      margin-top: 2px;
    }

    /* Footer */
    .footer {
      padding: 6px 14px 10px;
      font-size: 11px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">
      <span class="logo">🛒</span>
      Amazon Filter
    </div>
    <div class="toggle-wrap">
      <span class="toggle-label" id="enabledLabel">ON</span>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="stats-bar" id="statsBar">
    Loading stats…
  </div>

  <div class="body">

    <!-- Filter Mode -->
    <div class="section">
      <div class="section-title">Filter Mode</div>
      <div class="radio-group">
        <label>
          <input type="radio" name="mode" value="hide" id="modeHide" />
          Hide products
        </label>
        <label>
          <input type="radio" name="mode" value="dim" id="modeDim" />
          Dim with badge
        </label>
      </div>
    </div>

    <hr />

    <!-- Thresholds -->
    <div class="section">
      <div class="section-title">Minimum Thresholds</div>

      <div class="field">
        <label for="minReviews">Review count</label>
        <input type="number" id="minReviews" min="0" step="100" />
      </div>

      <div class="field">
        <label for="minStars">Avg star rating</label>
        <input type="number" id="minStars" min="1" max="5" step="0.1" />
      </div>

      <div class="field">
        <label for="minFiveStarPct">
          5-star %
          <div class="note">0 = disabled</div>
        </label>
        <input type="number" id="minFiveStarPct" min="0" max="100" step="5" />
      </div>
    </div>

    <hr />

    <!-- Toggles -->
    <div class="section">
      <div class="section-title">Filters</div>

      <div class="field">
        <label>Filter "Frequently returned"</label>
        <label class="mini-switch">
          <input type="checkbox" id="filterFrequentlyReturned" />
          <span class="mini-slider"></span>
        </label>
      </div>

    </div>

    <hr />

    <!-- Slow / overseas shipping -->
    <div class="section">
      <div class="section-title">Shipping</div>

      <div class="field">
        <label>Filter slow / overseas delivery</label>
        <label class="mini-switch">
          <input type="checkbox" id="filterSlowDelivery" />
          <span class="mini-slider"></span>
        </label>
      </div>

      <div class="field">
        <label for="maxDeliveryDays">
          Max delivery days
          <div class="note">Flags listings promising delivery beyond this many days</div>
        </label>
        <input type="number" id="maxDeliveryDays" min="1" max="90" step="1" />
      </div>
    </div>

    <hr />

    <!-- Auto-load -->
    <div class="section">
      <div class="section-title">Auto-Load More Pages</div>

      <div class="field">
        <label>Auto-load when too few visible</label>
        <label class="mini-switch">
          <input type="checkbox" id="autoLoadMore" />
          <span class="mini-slider"></span>
        </label>
      </div>

      <div class="field">
        <label for="minVisible">
          Target visible products
        </label>
        <input type="number" id="minVisible" min="1" max="100" step="1" />
      </div>
    </div>

  </div>

  <div class="footer">
    Settings sync across devices
  </div>

  <script src="popup.js"></script>
</body>
</html>
